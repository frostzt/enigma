name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

# Cancel in-progress runs when a new push occurs on the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pip install clang-format==22.1.1

      - name: Check formatting
        run: |
          find src include tests -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.cc' \) \
            | xargs clang-format --dry-run --Werror

  build-and-test:
    name: ${{ matrix.name }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu Latest (GCC)"
            os: ubuntu-latest
            sanitizer: "none"

          - name: "macOS Latest (Clang)"
            os: macos-latest
            sanitizer: "none"

          - name: "Ubuntu (ASan + UBSan)"
            os: ubuntu-latest
            sanitizer: "address"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.name }}-ccache

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENIGMA_SANITIZER=${{ matrix.sanitizer }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Run Tests
        env:
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    name: "Ubuntu (TSan)"
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ubuntu-tsan-ccache

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENIGMA_SANITIZER=thread \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Run Tests
        env:
          TSAN_OPTIONS: >-
            halt_on_error=1:second_deadlock_stack=1:history_size=7:suppressions=${{ github.workspace }}/.tsan-suppressions
        run: |
          ctest --test-dir build --output-on-failure \
            -E "DeathTest|destroy_cache_while_open_handle"
